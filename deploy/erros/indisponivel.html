<!doctype html>
<!--
  Servida pelo nginx no lugar do "502 Bad Gateway" quando o site não
  responde — quase sempre os segundos de um deploy. O Django está fora do ar
  nessa hora, então esta página não pode depender dele: HTML puro, estilo
  embutido, e só o logo, que o nginx serve direto do disco.

  Leva o cliente para a página inicial sozinha. Se o site ainda estiver
  subindo, ele cai aqui de novo e a contagem recomeça — é a própria tentativa.
-->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#D62B20">
  <meta name="robots" content="noindex">
  <title>Voltamos em instantes — Veterinária AgroCampo</title>
  <style>
    :root { --red: #D62B20; --ink: #221812; --muted: #8A7C70; --cream: #FFF8F0; --linha: #F0E2D3; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: var(--cream); color: var(--ink);
      font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .cartao {
      width: 100%; max-width: 460px; text-align: center;
      background: #fff; border: 1px solid var(--linha); border-radius: 20px;
      padding: 36px 24px; box-shadow: 0 10px 30px rgba(34, 24, 18, .06);
    }
    .logo { height: 64px; width: auto; margin-bottom: 20px; }
    h1 { font-size: 1.45rem; line-height: 1.25; margin: 0 0 10px; }
    p { margin: 0 0 8px; color: var(--muted); }
    .contagem { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--ink); }
    .botao {
      display: inline-block; margin-top: 20px; padding: 13px 26px; border-radius: 999px;
      background: var(--red); color: #fff; font-weight: 700; text-decoration: none;
    }
    .botao:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="cartao">
    <img class="logo" src="/static/img/logo-agrocampo.png" alt="Veterinária AgroCampo"
         onerror="this.remove()">
    <h1>Estamos atualizando a loja</h1>
    <p>Voltamos em instantes. Seu carrinho e seus pedidos continuam guardados.</p>
    <p>Levando você para a página inicial em <span class="contagem" id="contagem">6</span> s…</p>
    <a class="botao" href="/">Ir para a página inicial</a>
  </main>
  <script>
    (function () {
      var resta = 6;
      var alvo = document.getElementById('contagem');
      var relogio = setInterval(function () {
        resta -= 1;
        if (alvo) alvo.textContent = String(Math.max(resta, 0));
        if (resta <= 0) {
          clearInterval(relogio);
          window.location.replace('/');
        }
      }, 1000);
    })();
  </script>
</body>
</html>
