# Borda do stack AgroCampo: serve estáticos e mídia do disco e entrega o
# resto ao Gunicorn. O TLS termina no Traefik, então aqui só existe HTTP.

upstream agrocampo_app {
    server web:8000;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    # Um vídeo de banner de 30 s em 1080p passa fácil dos 25 MB que havia
    # aqui — o lojista via "erro de conexão" (nginx devolvia 413 e o painel
    # tentava ler JSON da página de erro do nginx). O limite da aplicação é
    # menor e avisa com clareza; este é só a rede de segurança.
    client_max_body_size 80M;

    # celular no 4G leva um tempo para empurrar dezenas de MB
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://agrocampo_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # o Traefik já terminou o TLS: sem isto o Django acha que é HTTP
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection        "";
        proxy_redirect off;
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               image/svg+xml application/xml font/woff2;
    gzip_min_length 512;
}
