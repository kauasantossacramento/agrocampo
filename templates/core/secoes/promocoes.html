{% if ofertas %}
<section class="section section--tight wrap">
  <div class="secao-titulo" data-reveal>
    <h2><span class="secao-titulo__icone secao-titulo__icone--quente"><svg width="18" height="18"><use href="#i-raio"></use></svg></span>Em promoção — só por tempo limitado</h2>
    <div class="row" style="gap:var(--s-2)">
      <a href="{% url 'catalog:catalogo' %}?promocao=1" class="secao-titulo__link">Ver todas →</a>
      <button class="btn btn--ghost btn--sm" data-carousel-prev aria-label="Anterior"><svg width="15" height="15"><use href="#i-seta-esq"></use></svg></button>
      <button class="btn btn--ghost btn--sm" data-carousel-next aria-label="Próximo"><svg width="15" height="15"><use href="#i-seta-dir"></use></svg></button>
    </div>
  </div>
  <div class="carousel" data-carousel>
    <div class="carousel__track" data-carousel-track>
      {% for produto in ofertas %}
        <div style="width:250px">{% include 'partials/product_card.html' %}</div>
      {% endfor %}
    </div>
  </div>
</section>
{% endif %}
