{% if mais_vendidos %}
<section class="section section--tight wrap">
  <div class="secao-titulo" data-reveal>
    <h2><span class="secao-titulo__icone"><svg width="18" height="18"><use href="#i-medalha"></use></svg></span>Maiores sucessos — {{ site.nome_loja }}</h2>
    <a href="{% url 'catalog:catalogo' %}?ordem=mais-vendidos" class="secao-titulo__link">Ver todos →</a>
  </div>
  <div class="grid grid--4" data-stagger>
    {% for produto in mais_vendidos %}{% include 'partials/product_card.html' %}{% endfor %}
  </div>
</section>
{% endif %}
