{% if categorias_destaque %}
<section class="section section--tight wrap">
  <div class="secao-titulo" data-reveal>
    <h2><span class="secao-titulo__icone"><svg width="18" height="18"><use href="#i-pacote"></use></svg></span>Compre por categoria</h2>
    <a href="{% url 'catalog:catalogo' %}" class="secao-titulo__link">Ver tudo →</a>
  </div>
  <div class="grid grid--6" data-stagger>
    {% for c in categorias_destaque %}
      <a href="{{ c.get_absolute_url }}" class="cat-tile">
        <span class="cat-tile__icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#c-{{ c.icone_svg }}"></use></svg>
        </span>
        <span>{{ c.nome }}</span>
      </a>
    {% endfor %}
  </div>
</section>
{% endif %}
